<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Display Properties</title>

<style>

body{
font-family: Arial, sans-serif;
margin:0;
background:#f4f6f8;
text-align:center;
}

header{
background:#003366;
color:white;
padding:20px;
}

.container{
padding:30px;
}

.box{
background:#0055a5;
color:white;
padding:20px;
margin:10px;
}

.block{
display:block;
}

.inline{
display:inline;
background:#ff9800;
}

.inlineblock{
display:inline-block;
background:#4caf50;
width:120px;
}

a{
display:inline-block;
margin-top:20px;
text-decoration:none;
background:#333;
color:white;
padding:10px 15px;
border-radius:5px;
}

</style>
</head>

<body>

<header>
<h1>Display Property Showcase</h1>
</header>

<div class="container">

<h2>Block Elements</h2>

<div class="box block">Block 1</div>
<div class="box block">Block 2</div>
<div class="box block">Block 3</div>

<h2>Inline Elements</h2>

<span class="box inline">Inline 1</span>
<span class="box inline">Inline 2</span>
<span class="box inline">Inline 3</span>

<h2>Inline-Block Elements</h2>

<div class="box inlineblock">Box 1</div>
<div class="box inlineblock">Box 2</div>
<div class="box inlineblock">Box 3</div>

<br><br>

<a href="../index.html">⬅ Back to Home</a>

</div>

</body>
</html>
