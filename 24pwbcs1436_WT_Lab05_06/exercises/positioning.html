<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Positioning Challenge</title>

<style>

body{
font-family:Arial, sans-serif;
margin:0;
background:#f4f6f8;
text-align:center;
}

header{
background:#003366;
color:white;
padding:20px;
}

.container{
padding:40px;
position:relative;
}

/* Common Box Style */
.box{
width:150px;
height:150px;
line-height:150px;
color:white;
font-weight:bold;
margin:20px auto;
}

/* Relative Box */
.relative{
background:#4CAF50;
position:relative;
left:10px;
}

/* Absolute Section */
.absolute-section{
position:relative;
height:200px;
margin-top:40px;
}

/* Absolute Box */
.absolute{
background:#FF9800;
position:absolute;
top:30px;
left:50%;
transform:translateX(-50%);
}

/* Fixed Box */
.fixed{
background:#f44336;
position:fixed;
top:20px;
right:20px;
padding:15px;
border-radius:5px;
color:white;
font-weight:bold;
}

/* Back Button */
.back{
display:inline-block;
margin-top:30px;
padding:10px 15px;
background:#333;
color:white;
text-decoration:none;
border-radius:5px;
}

</style>
</head>

<body>

<header>
<h1>CSS Positioning Demo</h1>
</header>

<div class="container">

<h2>Relative Position</h2>
<div class="box relative">Relative</div>

<div class="absolute-section">
<h2>Absolute Position</h2>
<div class="box absolute">Absolute</div>
</div>

</div>

<div class="fixed">Fixed Box</div>

<a class="back" href="../index.html">⬅ Back to Home</a>

</body>
</html>
