<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Grid Photo Gallery</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f4f6f8;
}

header{
background:#003366;
color:white;
text-align:center;
padding:20px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
padding:30px;
}

.gallery img{
width:100%;
height:200px;
object-fit:cover;
border-radius:8px;
box-shadow:0 0 8px gray;
}

footer{
background:#003366;
color:white;
text-align:center;
padding:20px;
margin-top:20px;
}

.back{
display:inline-block;
margin-top:10px;
padding:10px 15px;
background:white;
color:#003366;
text-decoration:none;
border-radius:5px;
font-weight:bold;
}

</style>

</head>

<body>

<header>
<h1>CSS Grid Photo Gallery</h1>
</header>

<div class="gallery">

<img src="https://picsum.photos/400/300?1">
<img src="https://picsum.photos/400/300?2">
<img src="https://picsum.photos/400/300?3">
<img src="https://picsum.photos/400/300?4">
<img src="https://picsum.photos/400/300?5">
<img src="https://picsum.photos/400/300?6">

</div>

<footer>

<p>Web Technology Lab</p>

<a class="back" href="../index.html">⬅ Back to Home</a>

</footer>

</body>
</html>
