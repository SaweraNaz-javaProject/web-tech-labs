<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Layout</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f4f6f8;
}

.container{
display:grid;
grid-template-columns:220px 1fr;
grid-template-rows:auto 1fr auto;
grid-template-areas:
"sidebar header"
"sidebar main"
"sidebar footer";
min-height:100vh;
}

.sidebar{
grid-area:sidebar;
background:#003366;
color:white;
padding:20px;
}

.sidebar ul{
list-style:none;
padding:0;
}

.sidebar li{
margin:15px 0;
}

.header{
grid-area:header;
background:#0055a5;
color:white;
padding:15px;
}

.main{
grid-area:main;
padding:30px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 0 8px gray;
text-align:center;
}

.footer{
grid-area:footer;
background:#003366;
color:white;
text-align:center;
padding:15px;
}

.back{
display:inline-block;
margin-top:10px;
padding:10px 15px;
background:white;
color:#003366;
text-decoration:none;
border-radius:5px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">
<h2>Dashboard</h2>
<ul>
<li>Home</li>
<li>Users</li>
<li>Reports</li>
<li>Settings</li>
</ul>
</div>

<div class="header">
<h2>Admin Panel</h2>
</div>

<div class="main">

<div class="card">
<h3>Users</h3>
<p>120</p>
</div>

<div class="card">
<h3>Orders</h3>
<p>75</p>
</div>

<div class="card">
<h3>Revenue</h3>
<p>$5400</p>
</div>

</div>

<div class="footer">

<p>Web Technology Lab</p>

<a class="back" href="../index.html">⬅ Back to Home</a>

</div>

</div>

</body>
</html>
