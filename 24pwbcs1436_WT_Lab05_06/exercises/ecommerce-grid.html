<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ecommerce Product Grid</title>

<style>

body{
margin:0;
font-family:Arial, sans-serif;
background:#f4f6f8;
}

header{
background:#003366;
color:white;
text-align:center;
padding:20px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:30px;
}

.product{
background:white;
border-radius:8px;
box-shadow:0 0 8px gray;
text-align:center;
padding-bottom:15px;
}

.product img{
width:100%;
height:160px;
object-fit:cover;
border-radius:8px 8px 0 0;
}

.product h3{
margin:10px 0;
}

.price{
color:#e91e63;
font-weight:bold;
margin-bottom:10px;
}

button{
background:#0055a5;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#003366;
}

footer{
background:#003366;
color:white;
text-align:center;
padding:20px;
}

.back{
display:inline-block;
margin-top:10px;
padding:10px 15px;
background:white;
color:#003366;
text-decoration:none;
border-radius:5px;
font-weight:bold;
}

</style>

</head>

<body>

<header>
<h1>Ecommerce Product Grid</h1>
</header>

<div class="products">

<div class="product">
<img src="../images/laptop.jpg">
<h3>Laptop</h3>
<p class="price">$900</p>
<button>Add to Cart</button>
</div>

<div class="product">
<img src="../images/headphones.jpg">
<h3>Headphones</h3>
<p class="price">$120</p>
<button>Add to Cart</button>
</div>

<div class="product">
<img src="../images/smartwatch.jpg">
<h3>Smart Watch</h3>
<p class="price">$250</p>
<button>Add to Cart</button>
</div>

<div class="product">
<img src="../images/camera.webp">
<h3>Camera</h3>
<p class="price">$600</p>
<button>Add to Cart</button>
</div>

</div>

<footer>

<p>Web Technology Lab</p>

<a class="back" href="../index.html">⬅ Back to Home</a>

</footer>

</body>
</html>
